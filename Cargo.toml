[workspace]
resolver = "3"
members = ["app", "crates/jdesk-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "FSL-1.1-ALv2" # LICENSE.md; each release becomes Apache-2.0 two years after it ships

[workspace.dependencies]
jdesk-core = { path = "crates/jdesk-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The window layout (docks, splits, tabs, Layout mode, pickers) is Chorong's, from crates.io.
# Pinned exactly: its API follows Chorong's needs and may change between releases.
cho-layout = "=0.1.1"
cho-layout-ui = "=0.1.1"
cho-theme = "=0.1.1"
gpui = "0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# cho-layout-ui 0.1.1 debug-asserts that every icon it names is bundled, and "move" (the
# Move pane to… list, w p) isn't: debug builds would panic there. The app serves the icon.
[profile.dev.package.cho-layout-ui]
debug-assertions = false

# Dependencies optimised so the debug app stays smooth, without debug info (as in Chorong).
[profile.dev.package."*"]
opt-level = 2
debug = false
