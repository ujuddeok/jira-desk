[package]
name = "jira-desk"
description = "Jira Desk: a fast, keyboard-first desktop viewer for a local copy of your Jira issues."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "jira-desk"
path = "src/main.rs"

[dependencies]
jdesk-core.workspace = true
cho-layout.workspace = true
cho-layout-ui.workspace = true
cho-theme.workspace = true
gpui.workspace = true
anyhow.workspace = true
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
schemars = "1"
time = { version = "0.3", features = ["parsing", "macros"] }
# Image sizes for inline attachments (already built for GPUI).
image = { version = "0.25", default-features = false }

[lints]
workspace = true

# gpui 0.2.2's xattr needs libc::ENOATTR, which libc 0.2.187+ dropped on Linux (as in Chorong).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"
