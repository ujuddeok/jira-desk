[package]
name = "jdesk-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
jdesk-core = { path = "../crates/jdesk-core" }
serde_json = "1"
toml = "0.8"

# Its own workspace: built with nightly by cargo-fuzz, never by the app's `cargo build`.
[workspace]

[[bin]]
name = "adf"
path = "fuzz_targets/adf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "issue"
path = "fuzz_targets/issue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link"
path = "fuzz_targets/link.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal"
path = "fuzz_targets/journal.rs"
test = false
doc = false
bench = false
